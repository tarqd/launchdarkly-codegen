name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  compile:
    name: compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ts-server, dotnet, go]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        if: matrix.target == 'dotnet'
        with:
          dotnet-version: 8.0.x
      # Go 1.25 is go-server-sdk v7's floor; staticcheck 2025.1.1 is pinned with it (DESIGN.md → go → Toolchain).
      - uses: actions/setup-go@v5
        if: matrix.target == 'go'
        with:
          go-version: '1.25.0'
          cache-dependency-path: fixtures/compile/go/go.sum
      - if: matrix.target == 'go'
        run: go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:compile -t '${{ matrix.target }}'

  # Packs @launchtarqly/codegen, installs the tarball into a scratch project
  # with npm, and runs its bin (`generate`, then `check`) on a fixture snapshot.
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:smoke
