# The PR title becomes the squash-merge commit that release-please reads, so it
# must be a Conventional Commit (after launchdarkly/js-core's lint-pr-title.yml).
name: Lint PR title

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

permissions:
  pull-requests: read

jobs:
  main:
    name: Verify the PR title matches conventional commit spec.
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
