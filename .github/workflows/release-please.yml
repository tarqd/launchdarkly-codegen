# Releases @launchtarqly/codegen, after launchdarkly/js-core's release-please.yml.
#
# AUTOMATED (push to main):
#   - release-please reads the Conventional Commits since the last release and
#     keeps a release PR open with the next version and CHANGELOG.md. fix: is a
#     patch, feat: a minor, and a `!` or BREAKING CHANGE footer a major. While
#     the version is 0.x, a breaking change bumps the minor instead.
#   - Merging the release PR tags vX.Y.Z, creates the GitHub release, and runs
#     the publish job, which stages the version on npm.
#
# MANUAL (workflow_dispatch), by `task`:
#   - release-pr: runs release-please now, e.g. after a merged PR's body gained
#     a BEGIN_COMMIT_OVERRIDE block. Publishes only if it creates a release.
#   - publish: stages the checked-out ref on npm, to redo a failed publish or
#     to try a dry run. Pick the release tag as the ref.
#
# npm: trusted publishing (OIDC), no token. npm trusts this workflow file run
# in the `Publish` environment, for `npm stage publish` only, so a version is
# staged, never published. A maintainer makes it live with `npm stage approve
# <stage-id>` and 2FA; `npm stage list @launchtarqly/codegen` shows what is
# waiting. Renaming this file or the environment breaks the trust relationship.
name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      task:
        description: 'release-pr: run release-please now. publish: stage the selected ref on npm.'
        type: choice
        required: true
        default: release-pr
        options:
          - release-pr
          - publish
      prerelease:
        description: '(publish) Is this a prerelease. If so, it is staged under the prerelease dist-tag, not latest.'
        type: boolean
        required: true
        default: false
      dry_run:
        description: '(publish) Is this a dry run. If so, the package is packed but not staged.'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.task == 'release-pr'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [release-please]
    # Runs after a release, or on its own (release-please skipped) for the publish task.
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || inputs.task == 'publish') }}
    runs-on: ubuntu-latest
    environment: Publish
    permissions:
      contents: read
      # npm swaps the job's OIDC token for a short-lived publish credential,
      # and signs the provenance attestation with it.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      # `npm stage` needs npm 11.15.0 or later (trusted publishing, 11.5.1).
      - run: npm install -g npm@11.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:smoke
      # pnpm pack runs prepack (the esbuild bundle) and writes the tarball the smoke test checks.
      - name: Pack
        run: |
          pnpm --filter @launchtarqly/codegen pack --pack-destination "$RUNNER_TEMP/pack"
          echo "TARBALL=$(ls "$RUNNER_TEMP"/pack/*.tgz)" >> "$GITHUB_ENV"
      - name: Stage on npm
        run: |
          args=(--access public)
          # npm accepts provenance only from public repositories.
          if [ "$REPO_PRIVATE" != 'true' ]; then args+=(--provenance); fi
          if [ "$PRERELEASE" = 'true' ]; then args+=(--tag prerelease); fi
          if [ "$DRY_RUN" = 'true' ]; then args+=(--dry-run); fi
          npm stage publish "$TARBALL" "${args[@]}"
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
          # The inputs apply only to the publish task; a release always stages for real.
          PRERELEASE: ${{ inputs.task == 'publish' && inputs.prerelease }}
          DRY_RUN: ${{ inputs.task == 'publish' && inputs.dry_run }}
